<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f111a"/>
            <stop offset="100%" stop-color="#050608"/>
        </linearGradient>
        <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f0ff"/>
            <stop offset="50%" stop-color="#7000ff"/>
            <stop offset="100%" stop-color="#ff007f"/>
        </linearGradient>
        <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f0ff"/>
            <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Glass Squircle Outer Border with Neon Gradient -->
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#neonGlow)" stroke-width="2.5"/>

    <!-- Subtle inner specular glass reflection -->
    <rect x="4" y="4" width="56" height="26" rx="14" fill="white" fill-opacity="0.06"/>

    <!-- Futuristic Robotic Math Calculator Emblem (Sigma / AI Symbol) -->
    <path d="M46 16 H18 L32 32 L18 48 H46" 
          fill="none" 
          stroke="url(#symbolGrad)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Small Glowing AI Quantum Node -->
    <circle cx="44" cy="32" r="3.2" fill="#00f0ff" filter="url(#glow)"/>
</svg>
